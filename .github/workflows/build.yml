name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pyinstaller playwright pyyaml numpy pillow && playwright install chromium --with-deps

      - name: Build with PyInstaller
        run: pyinstaller TL_monitor.spec --clean -y

      - name: Bundle playwright Python package
        run: python -c "import playwright, os, shutil; src = os.path.dirname(playwright.__file__); dst = 'dist/TL_monitor/_internal/playwright'; os.makedirs(dst, exist_ok=True); [shutil.copytree(os.path.join(src, i), os.path.join(dst, i), dirs_exist_ok=True) if os.path.isdir(os.path.join(src, i)) else shutil.copy2(os.path.join(src, i), os.path.join(dst, i)) for i in os.listdir(src)]"

      - name: Copy Chromium to bundle location
        run: python -c "import os, shutil; la = os.environ.get('LOCALAPPDATA'); sb = os.path.join(la, 'ms-playwright'); db = os.path.abspath('dist/TL_monitor/_internal/playwright/driver/package/.local-browsers'); os.makedirs(db, exist_ok=True); [shutil.copytree(os.path.join(sb, n), os.path.join(db, n)) for n in ['chromium_headless_shell-1208', 'chromium-1208'] if os.path.exists(os.path.join(sb, n)) and not os.path.exists(os.path.join(db, n))]; [print(os.path.join(r, f)) for r, d, fs in os.walk(db) for f in fs if f.endswith('.exe')]"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TL_monitor-win
          path: dist/TL_monitor/
          compression-level: 9
