name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pyinstaller playwright pyyaml numpy pillow winotify pywin32 && playwright install chromium --with-deps

      - name: Post-install pywin32
        run: python Scripts/pywin32_postinstall.py -install 2>&1 || (echo "pywin32 postinstall skipped" && exit 0)

      - name: Build with PyInstaller
        run: pyinstaller TL_monitor.spec --clean -y

      - name: Bundle playwright Python package
        run: python -c "import playwright, os, shutil; src = os.path.dirname(playwright.__file__); dst = 'dist/TL_monitor/_internal/playwright'; os.makedirs(dst, exist_ok=True); [shutil.copytree(os.path.join(src, i), os.path.join(dst, i), dirs_exist_ok=True) if os.path.isdir(os.path.join(src, i)) else shutil.copy2(os.path.join(src, i), os.path.join(dst, i)) for i in os.listdir(src)]"

      - name: Package Chromium as zip
        run: |
          python -c "import os, zipfile; la = os.environ.get('LOCALAPPDATA'); src = os.path.join(la, 'ms-playwright', 'chromium_headless_shell-1208'); zip_path = 'dist/TL_monitor/_internal/chromium_headless_shell.zip'; os.makedirs(os.path.dirname(zip_path), exist_ok=True); zf = zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9); [zf.write(os.path.join(root, f), os.path.relpath(os.path.join(root, f), src)) for root, dirs, files in os.walk(src) for f in files]; zf.close(); print('Zip size:', os.path.getsize(zip_path), 'bytes')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TL_monitor-win
          path: dist/TL_monitor/
          compression-level: 9
