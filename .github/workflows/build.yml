name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install chromium

      - name: Syntax check
        run: |
          python -m py_compile server.py scraper.py notifier.py
          echo "Syntax check passed"

      - name: Test import
        run: |
          python -c "import server, scraper, notifier; print('All imports OK')"
