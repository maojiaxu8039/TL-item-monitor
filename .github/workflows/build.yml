name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade pyinstaller playwright pyyaml numpy pillow && playwright install chromium --with-deps

      - name: Bundle playwright Python package
        run: python -c "import playwright, os, shutil; src = os.path.dirname(playwright.__file__); dst = 'dist/TL_monitor/_internal/playwright'; os.makedirs(dst, exist_ok=True); [shutil.copytree(os.path.join(src, i), os.path.join(dst, i), dirs_exist_ok=True) if os.path.isdir(os.path.join(src, i)) else shutil.copy2(os.path.join(src, i), os.path.join(dst, i)) for i in os.listdir(src)]"

      - name: Build with PyInstaller
        run: pyinstaller TL_monitor.spec --clean -y

      - name: Copy Chromium to _internal
        run: |
          python -c "import os, shutil; la = os.environ.get('LOCALAPPDATA'); src = os.path.join(la, 'ms-playwright', 'chromium_headless_shell-1208'); dst = 'dist/TL_monitor/_internal/chromium_headless_shell-1208'; os.makedirs(os.path.dirname(dst), exist_ok=True); shutil.copytree(src, dst, dirs_exist_ok=True); print('Copied Chromium to', dst)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TL_monitor-win
          path: dist/TL_monitor/
          compression-level: 9
