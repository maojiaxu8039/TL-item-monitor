name: Build Windows EXE

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller playwright pyyaml numpy pillow
          playwright install chromium --with-deps

      - name: Build with PyInstaller
        run: |
          pyinstaller TL_monitor.spec --clean -y

      - name: Bundle Chromium
        run: |
          $src = "$env:LOCALAPPDATA\ms-playwright\chromium_headless_shell-1208\chrome-headless-shell-win64"
          $dst = "dist\TL_monitor\_internal\playwright_browsers\chromium_headless_shell-1208\chrome-headless-shell-win64"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item -Path "$src\*" -Destination $dst -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TL_monitor-win
          path: dist/TL_monitor/
          compression-level: 9
