name: Build Windows EXE

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pyinstaller playwright pyyaml numpy pillow
          playwright install chromium --with-deps

      - name: Build with PyInstaller
        run: |
          pyinstaller TL_monitor.spec --clean -y

      - name: Bundle Chromium to playwright default location
        run: |
          $src = "$env:LOCALAPPDATA\ms-playwright\chromium_headless_shell-1208\chrome-headless-shell-win64"
          $dst = "dist\TL_monitor\_internal\playwright\driver\package\.local-browsers\chromium_headless_shell-1208\chrome-headless-shell-win64"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item -Path "$src\*" -Destination $dst -Recurse -Force

      - name: Bundle playwright Python package (including driver)
        run: |
          python -c "
import playwright, os, shutil
src = os.path.dirname(playwright.__file__)
dst = 'dist/TL_monitor/_internal/playwright'
os.makedirs(dst, exist_ok=True)
for item in os.listdir(src):
    src_path = os.path.join(src, item)
    dst_path = os.path.join(dst, item)
    if os.path.isdir(src_path):
        if os.path.islink(src_path):
            shutil.copytree(os.readlink(src_path), dst_path, dirs_exist_ok=True)
        else:
            shutil.copytree(src_path, dst_path, dirs_exist_ok=True)
    else:
        shutil.copy2(src_path, dst_path)
print('Copied playwright package to', dst)
print('Driver contents:', os.listdir(os.path.join(dst, 'driver')) if os.path.exists(os.path.join(dst, 'driver')) else 'no driver dir')
"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TL_monitor-win
          path: dist/TL_monitor/
          compression-level: 9
